[mypy]
python_version = 3.12

# Migrations are machine-generated boilerplate (Alembic's own template),
# not this project's hand-written code style, and — per the database-
# testing phase's write-up — an applied migration is a historical record
# not meant to be edited retroactively, including for type-annotation
# cleanup.
exclude = ^alembic/versions/

# Deliberately NOT `strict = true` — this is the FIRST time this
# codebase has ever been type-checked (verified directly: running mypy
# with a minimal config against the real, unmodified codebase surfaced
# exactly 16 real findings, all fixed or precisely annotated as part of
# this same phase — see the fixes in services/llm/openai_provider.py,
# services/llm/local_provider.py, core/vector_store.py,
# core/request_context.py, services/conversation_service.py). Enabling
# every strict flag on day one, on a large codebase, tends to produce a
# wall of findings nobody triages individually — exactly the "keep
# workflows readable and maintainable" trap this phase's rules warn
# against.
#
# check_untyped_defs is deliberately OFF (mypy's own default) rather
# than on — turning it on was tried directly during this phase and
# surfaced ~45 further findings, nearly all of them the SAME shape:
# test fixtures (FakeVectorStore, FakeDocumentRepository, FakeRetriever
# — see tests/test_retrieval_service.py, tests/test_tools.py) passed
# where a service's constructor is typed against a CONCRETE class
# (VectorStore, DocumentRepository) rather than a Protocol. That's a
# real, structural, project-wide inconsistency (some dependencies —
# EmbeddingModel, Storage, LLMProvider — already use Protocol; others
# don't yet), and a genuinely good future improvement — but fixing it
# means introducing new Protocols for several core classes, a real
# design decision belonging to its own phase, not a side effect of
# turning on a stricter mypy flag while wiring up CI.
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Third-party packages this project depends on but that don't ship
# complete type stubs — verified directly (mypy's own "no stubs found"
# errors) rather than blanket-silencing every third-party import.
[mypy-sentence_transformers.*]
ignore_missing_imports = true

[mypy-authlib.*]
ignore_missing_imports = true
